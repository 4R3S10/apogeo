# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Se publica en ghcr.io/4r3s10/apogeo
name: apogeo
description: Apogeo, el sistema de Ares (basado en Bazzite)

base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  # Letra Nunito e iconos Papirus
  - type: dnf
    install:
      packages:
        - papirus-icon-theme
        - vernnobile-nunito-fonts

  # Nombre y logo del sistema; estética (carpetas rosa, cursor berenjena, letra, iconos, colores, sonidos y teclado)
  - type: script
    scripts:
      - branding.sh
      - estetica.sh

  # Pisos (Jugar, Navegar, Estudiar) y la salud del PC
  - type: systemd
    system:
      enabled:
        - apogeo-termico.service
    user:
      enabled:
        - apogeo-pisos.service

  # Epic Games: Heroic (con tu cuenta de Epic); el lanzador oficial se añadirá con Proton
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.heroicgameslauncher.hgl

  # Firma de las imágenes (clave pública: cosign.pub; la privada es el secreto SIGNING_SECRET)
  - type: signing
