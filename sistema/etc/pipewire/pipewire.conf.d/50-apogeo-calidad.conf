# Apogeo: el sonido con la mejor calidad. Sin convertir cuando no hace falta: si suena una sola cosa, la tarjeta se pone
# a su frecuencia (44,1 kHz la música, 48 kHz los juegos y vídeos, 96 o 192 kHz lo de alta resolución) en vez de pasarlo
# todo a 48 kHz. Lo que haya que convertir, con la máxima calidad (resample.quality, en los otros archivos).
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
}
