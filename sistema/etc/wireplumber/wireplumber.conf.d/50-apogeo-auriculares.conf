# Apogeo: el sonido sale por tus auriculares (la salida analógica: la clavija de 3,5 mm).
# - La salida analógica va antes que la HDMI o DisplayPort de la pantalla (que a veces se quedaba como la de serie).
# - Al enchufar los auriculares, la salida pasa a ellos sola (el puerto «Auriculares» de la tarjeta) y al quitarlos
#   vuelve a los altavoces.
# - Las apps no se quedan pegadas a la salida en la que sonaron la última vez: siguen a la que está puesta (si no,
#   Spotify o un juego podían seguir por los altavoces o la pantalla con los auriculares puestos).
wireplumber.settings = {
    node.stream.restore-target = false
}

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*analog.*" }
    ]
    actions = {
      update-props = {
        priority.session = 1600
        priority.driver  = 1600
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*hdmi.*" }
      { node.name = "~alsa_output.*HDMI.*" }
      { node.name = "~alsa_output.*DisplayPort.*" }
    ]
    actions = {
      update-props = {
        priority.session = 400
        priority.driver  = 400
      }
    }
  }
]
