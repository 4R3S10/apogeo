# Apogeo: las apps no se quedan pegadas a la salida en la que sonaron la última vez, siguen a la que está puesta (si no,
# Spotify o un juego podían seguir por los altavoces o la pantalla con los auriculares puestos). La salida la eliges tú
# (el icono del sonido de la barra): Apogeo no la cambia.
wireplumber.settings = {
    node.stream.restore-target = false
}
