# Inicio de sesión de Apogeo: tema propio, cursor berenjena y la letra de Ágape (CachyOS ya usa SDDM con Wayland)
[General]
# (lo de CachyOS para Wayland y, además, que el tema pueda leer tus colores: /var/lib/apogeo/aspecto-login.json)
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,QML_XHR_ALLOW_FILE_READ=1

[Theme]
Current=apogeo
CursorTheme=Apogeo-cursor
Font=Bricolage Grotesque
