# Inicio de sesión de Apogeo: tema propio, cursor berenjena y letra Nunito (CachyOS ya usa SDDM con Wayland)
[Theme]
Current=apogeo
CursorTheme=Apogeo-cursor
Font=Bricolage Grotesque

# Entrar con neuronas: la pantalla de inicio de sesión lee el verificador de /var/lib/apogeo/neuronas (Qt solo deja leer
# archivos desde QML con esto). Se mantiene lo de CachyOS para SDDM en Wayland.
[General]
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,QML_XHR_ALLOW_FILE_READ=1
