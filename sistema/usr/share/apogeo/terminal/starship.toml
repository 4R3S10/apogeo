# Órbita · el prompt «T1 · Cristal con píldoras»: la carpeta en una píldora cian y la rama de git en otra grafito.
# Se usa si no tienes tu propio ~/.config/starship.toml
add_newline = true
format = "$directory$git_branch$git_status$cmd_duration$character"

[directory]
style = "bg:#45d6ff fg:#041318 bold"
format = "[](fg:#45d6ff)[ $path$read_only ]($style)[](fg:#45d6ff) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " "

[git_branch]
symbol = " "
style = "bg:#1b2430 fg:#e9edf5"
format = "[](fg:#1b2430)[$symbol$branch]($style)[](fg:#1b2430) "

[git_status]
style = "fg:#b79cff"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 3000
style = "fg:#8b94a7"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold #45d6ff)"
error_symbol = "[❯](bold #ff6b81)"
