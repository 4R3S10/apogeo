title    Instalar Apogeo
# (copytoram: el USB entero a la memoria al arrancar, así se puede quitar en cualquier momento)
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=y quiet loglevel=3 %KERNEL_PARAMS%
